[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv", "chromium", "fonts-liberation", "fonts-noto-color-emoji"]

[phases.install]
cmd = "python3 -m venv /opt/venv && /opt/venv/bin/pip install --no-cache-dir edge-tts"

[variables]
PATH = "/opt/venv/bin:$PATH"

[start]
cmd = "npm run dev"
